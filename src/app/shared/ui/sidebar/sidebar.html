<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__logo" aria-hidden="true">◆</span>
    <span class="sidebar__brand-text">Acme&nbsp;Admin</span>
  </div>

  <div class="sidebar__tenant">
    <label class="sidebar__tenant-label" for="tenant-select">Active tenant</label>
    <div class="sidebar__tenant-row">
      @if (activeTenant(); as t) {
        <span class="sidebar__tenant-badge" aria-hidden="true">{{ t.branding.shortName }}</span>
      }
      <select
        id="tenant-select"
        class="sidebar__tenant-select"
        [value]="activeTenant()?.id ?? ''"
        (change)="onTenantSelect($event)"
      >
        @for (tenant of tenants(); track tenant.id) {
          <option [value]="tenant.id">{{ tenant.name }}</option>
        }
      </select>
    </div>
  </div>

  <nav class="sidebar__nav" aria-label="Primary">
    <ul class="sidebar__list">
      @for (item of items(); track item.path) {
        <li>
          <a
            class="sidebar__link"
            [routerLink]="item.path"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: false }"
          >
            <span class="sidebar__icon" aria-hidden="true">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        </li>
      } @empty {
        <li class="sidebar__empty">No modules enabled</li>
      }
    </ul>
  </nav>

  <div class="sidebar__footer">
    <a
      class="sidebar__link sidebar__profile-link"
      routerLink="/app/profile"
      routerLinkActive="sidebar__link--active"
    >
      <span class="sidebar__icon" aria-hidden="true">☺</span>
      <span>My profile</span>
    </a>
    <span class="sidebar__footer-text">Multi-tenant control panel</span>
  </div>
</aside>
